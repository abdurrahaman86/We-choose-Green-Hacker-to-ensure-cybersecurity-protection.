    <style>

            background-image: linear-gradient(rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.8)), url('https://uploads.onecompiler.io/44mtbptam/44n7vbwd7/13477.gif');

        #input-container {

<body>

    <div id="input-container">

        <input type="text" id="fb-url" placeholder="Paste Facebook URL here...">
        <br>
        <button onclick="startMagic()">START ANALYSIS</button>
    </div>

    <div id="console"></div>
    <div id="success-msg">SUCCESSFUL ACCESS BY NAHID HOSSEN</div>

    <script>
        const consoleBox = document.getElementById('console');
        const inputContainer = document.getElementById('input-container');
        const successMsg = document.getElementById('success-msg');

        const magicLines = [
            "Establishing connection to global satellites...",
            "Requesting access to fb_graph_database...",
            "Overriding security firewall [Sub-Level 4]...",
            "Accessing user private encryption keys...",
            "Analyzing data packets... Please wait...",
            "Running brute-force script on AES-256...",
            "Extracting profile metadata and cookies...",
            "Warning: Server 403 bypassed successfully.",
            "Retrieving authentication tokens...",
            "Finalizing system injection...",
            "Status: System fully compromised."
        ];

        function startMagic() {
            const url = document.getElementById('fb-url').value;
            if(!url) { alert("Please enter a URL first!"); return; }

            inputContainer.style.display = 'none';
            consoleBox.style.display = 'block';

            let lineIndex = 0;

            function printLine() {
                if (lineIndex < magicLines.length) {
                    const div = document.createElement('div');
                    div.textContent = ">>> " + magicLines[lineIndex];
                    consoleBox.appendChild(div);
                    consoleBox.scrollTop = consoleBox.scrollHeight;
                    lineIndex++;
                    
                    // অতিরিক্ত ডামি কোড দেখানোর জন্য
                    const codeDiv = document.createElement('div');
                    codeDiv.textContent = "HEX_" + Math.random().toString(16).toUpperCase().substring(2, 12) + " [SECURED]";
                    codeDiv.style.color = "#444";
                    consoleBox.appendChild(codeDiv);

                    setTimeout(printLine, 800); 
                } else {
                    setTimeout(showFinal, 1500);
                }
            }
            printLine();
        }

        function showFinal() {
            consoleBox.style.display = 'none';
            successMsg.style.display = 'block';
        }
    </script>
